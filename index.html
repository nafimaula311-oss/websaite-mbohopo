<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semangat Untuk Kamu</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ff9eb5,#ffc0cb,#ffe4e1);
      overflow:hidden;
    }

    .container{
      background:rgba(255,255,255,0.2);
      backdrop-filter:blur(10px);
      padding:40px;
      border-radius:25px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
      width:350px;
      animation:muncul 1s ease;
    }

    .photo{
      width:200px;
      height:200px;
      object-fit:cover;
      border-radius:20px;
      border:5px solid white;
      margin-bottom:20px;
      transition:0.3s;
    }

    .photo:hover{
      transform:scale(1.05);
      box-shadow:0 0 25px white;
    }

    h1{
      color:white;
      margin-bottom:15px;
      text-shadow:2px 2px 10px rgba(0,0,0,0.3);
    }

    input{
      width:100%;
      padding:12px;
      border:none;
      border-radius:20px;
      outline:none;
      text-align:center;
      font-size:16px;
      margin-bottom:15px;
    }

    button{
      padding:12px 25px;
      border:none;
      border-radius:25px;
      background:white;
      color:#ff4f81;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
      font-size:16px;
    }

    button:hover{
      background:#ff4f81;
      color:white;
      transform:scale(1.05);
    }

    #hasil{
      margin-top:20px;
      color:white;
      font-size:22px;
      line-height:1.5;
    }

    .heart{
      position:absolute;
      color:white;
      animation:terbang 5s linear infinite;
      opacity:0.7;
    }

    @keyframes terbang{
      0%{
        transform:translateY(100vh) scale(0);
        opacity:0;
      }

      50%{
        opacity:1;
      }

      100%{
        transform:translateY(-10vh) scale(1.5);
        opacity:0;
      }
    }

    @keyframes muncul{
      from{
        opacity:0;
        transform:translateY(30px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

  </style>
</head>
<body>

  <div class="container">

    <!-- GANTI FOTO -->
    <img src="febi.jpg" class="photo">

    <h1>Hai Kamu 💖</h1>

    <input type="text" id="nama" placeholder="Masukkan nama kamu">

    <button onclick="tampilkanUcapan()">
      Klik Disini
    </button>

    <div id="hasil"></div>

  </div>

  <script>

    function tampilkanUcapan(){

      const nama = document.getElementById("nama").value;

      if(nama === ""){
        alert("Masukkan nama dulu ya 😊");
        return;
      }

      document.getElementById("hasil").innerHTML =
      `Hai ${nama} 💖<br>
      Semangat ya hari ini ✨<br>
      Kamu hebat dan pasti bisa 😊`;
    }

    function buatHati(){

      const heart = document.createElement("div");

      heart.classList.add("heart");

      heart.innerHTML = "❤";

      heart.style.left = Math.random() * window.innerWidth + "px";

      heart.style.fontSize = (Math.random() * 20 + 10) + "px";

      heart.style.animationDuration = (Math.random() * 3 + 2) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      },5000);
    }

    setInterval(buatHati,300);

  </script>

</body>
</html>
