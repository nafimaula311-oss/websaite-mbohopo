
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untuk Dia</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffb6c1, #ffc0cb, #ffe4e1);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      animation: fadeIn 1.5s ease;
    }

    .photo {
      width: 250px;
      height: 250px;
      border-radius: 20px;
      object-fit: cover;
      border: 5px solid white;
      transition: 0.4s;
    }

    .photo:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(255,255,255,0.8);
    }

    h1 {
      margin-top: 20px;
      color: white;
      font-size: 32px;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
    }

    p {
      margin-top: 10px;
      color: white;
      font-size: 18px;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 30px;
      background: white;
      color: #ff4f81;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
    }

    button:hover {
      background: #ff4f81;
      color: white;
      transform: scale(1.05);
    }

    .heart {
      position: absolute;
      color: rgba(255,255,255,0.8);
      font-size: 20px;
      animation: float 5s linear infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="febi.jpg" alt="Foto Dia" class="photo">

    <h1>Hai Kamu ✨</h1>
    <p>Kamu itu spesial banget buat aku 💖</p>

    <button onclick="showMessage()">Klik Ini</button>
  </div>

  <script>
    function showMessage() {
      alert("Semoga harimu selalu menyenangkan 😊");
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤";

      heart.style.left = Math.random() * window.innerWidth + "px";
      heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
      heart.style.fontSize = (Math.random() * 20 + 10) + "px";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

    setInterval(createHeart, 300);
  </script>

</body>
</html>
